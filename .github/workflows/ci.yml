name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devspace
          POSTGRES_PASSWORD: devspace
          POSTGRES_DB: devspace_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devspace -d devspace_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://devspace:devspace@localhost:5432/devspace_ai
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.11"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest -v
